<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Admin Dashboard | SmartBite</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/admin_dashboard.css">
  <link rel="stylesheet" href="assets/css/admin_common.css">
</head>
<body>
<header class="topbar">
  <div class="topbar-inner container">
    <div class="brand">
      <div class="logo-dot"></div>
      <a class="brand-name" href="index.html">SmartBite</a>
    </div>

    <nav class="nav" id="sb-nav">
      <a class="nav-link" href="index.html">Home</a>
      <a class="nav-link" href="browse.html">Browse</a>
      <a class="nav-link" href="cart.html">Cart</a>
      <a class="nav-link" href="orders.html">Orders</a>
      <a class="nav-link" href="contact.html">Contact</a>

      <span class="nav-user" id="sb-user-area" style="display:none; align-items:center; gap:10px;">
        <span class="badge" id="sb-user-role">guest</span>
        <span class="muted small" id="sb-user-name"></span>
        <a class="nav-link" id="sb-admin-link" href="admin_dashboard.html" style="display:none;">Admin</a>
        <a class="nav-link" id="sb-restaurant-link" href="restaurant_dashboard.html" style="display:none;">Restaurant</a>
        <a class="nav-link" id="sb-delivery-link" href="delivery_dashboard.html" style="display:none;">Delivery</a>
        <a class="nav-link" href="#" id="sb-logout">Logout</a>
      </span>

      <span class="nav-user" id="sb-guest-area" style="display:flex; align-items:center; gap:10px;">
        <a class="nav-link" href="login.html">Login</a>
        <a class="nav-link" href="register.html">Registration</a>
      </span>
    </nav>
  </div>
</header>


<main class="container admin-wrap">
  <section class="admin-card card">
    <h1 class="admin-title">Admin Dashboard</h1>
    <p class="muted admin-sub">Manage users, restaurants, and orders.</p>

    <div class="stats-grid">
      <div class="stat">
        <div class="muted">Users</div>
        <div class="stat-num" id="stat-users">0</div>
      </div>
      <div class="stat">
        <div class="muted">Restaurants</div>
        <div class="stat-num" id="stat-restaurants">0</div>
      </div>
      <div class="stat">
        <div class="muted">Orders</div>
        <div class="stat-num" id="stat-orders">0</div>
      </div>
    </div>

    <div class="admin-actions">
      <a class="pill-btn" href="admin_users.html">Users</a>
      <a class="pill-btn" href="admin_restaurants.html">Restaurants</a>
      <a class="pill-btn" href="admin_orders.html">Orders</a>
    </div>
  </section>
</main>

<footer class="footer">
  <div class="container footer-inner">
    <div class="muted small">© <span id="sb-year"></span> SmartBite. All rights reserved.</div>
  </div>
</footer>

<script src="admin/guard.js"></script>
<script src="admin/dashboard.js"></script>
</body>
</html>
