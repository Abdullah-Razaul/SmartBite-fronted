<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Restaurant | SmartBite</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/restaurant_view.css">
</head>
<body>
<header class="topbar">
  <div class="topbar-inner container">
    <div class="brand">
      <div class="logo-dot"></div>
      <a class="brand-name" href="index.html">SmartBite</a>
    </div>

    <nav class="nav" id="sb-nav">
      <a class="nav-link" href="index.html">Home</a>
      <a class="nav-link" href="browse.html">Browse</a>
      <a class="nav-link" href="cart.html">Cart</a>
      <a class="nav-link" href="orders.html">Orders</a>
      <a class="nav-link" href="contact.html">Contact</a>

      <span class="nav-user" id="sb-user-area" style="display:none; align-items:center; gap:10px;">
        <span class="badge" id="sb-user-role">guest</span>
        <span class="muted small" id="sb-user-name"></span>
        <a class="nav-link" id="sb-admin-link" href="admin_dashboard.html" style="display:none;">Admin</a>
        <a class="nav-link" id="sb-restaurant-link" href="restaurant_dashboard.html" style="display:none;">Restaurant</a>
        <a class="nav-link" id="sb-delivery-link" href="delivery_dashboard.html" style="display:none;">Delivery</a>
        <a class="nav-link" href="#" id="sb-logout">Logout</a>
      </span>

      <span class="nav-user" id="sb-guest-area" style="display:flex; align-items:center; gap:10px;">
        <a class="nav-link" href="login.html">Login</a>
        <a class="nav-link" href="register.html">Registration</a>
      </span>
    </nav>
  </div>
</header>


<main class="container rest-page">

  <!-- Top restaurant info card -->
  <section class="rest-hero card">
    <div class="rest-hero-left">
      <div class="rest-avatar">
        <span class="rest-icon">🍽️</span>
      </div>

      <div class="rest-meta">
        <h1 class="rest-name" id="rest-name">TO TO Company</h1>
        <div class="rest-sub muted" id="rest-sub">Food • cumilla</div>

        <div class="rest-rating">
          <span class="star">⭐</span>
          <strong id="rest-rating">4.5</strong>
          <span class="muted">(<span id="rest-reviews">0</span>+)</span>
        </div>
      </div>
    </div>

    <div class="promo-dot" title="Promo"></div>
  </section>

  <!-- Menu card -->
  <section class="menu-wrap card">
    <h2 class="menu-title">Menu</h2>

    <div class="menu-grid" id="menu-grid">
      <!-- demo card (JS দিয়ে replace হবে) -->
      <article class="food-card">
        <div class="food-img">
          <img src="assets/img/food1.jpg" alt="Food">
        </div>
        <h3 class="food-name">birani</h3>
        <div class="muted food-desc">Tasty &amp; fresh</div>
        <div class="food-price">৳ 80.00</div>
        <div class="muted small">Delivery charge: ৳ 10</div>

        <div class="food-actions">
          <input class="qty" type="number" min="1" value="1">
          <button class="add-btn" type="button">Add</button>
        </div>
      </article>
    </div>
  </section>

</main>

<footer class="footer">
  <div class="container footer-inner">
    <div class="muted small">© <span id="sb-year"></span> SmartBite. All rights reserved.</div>
  </div>
</footer>


  <script src="js/app.js"></script>
  <script src="js/pages/restaurant.js"></script>
</body>
</html>
