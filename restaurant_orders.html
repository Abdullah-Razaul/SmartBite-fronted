<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>

  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/restaurant_portal.css">
</head>
<body>

<header class="topbar">
  <div class="topbar-inner container">
    <div class="brand"><div class="logo-dot"></div><a class="brand-name" href="index.html">SmartBite</a></div>
    <nav class="nav" id="sb-nav">
      <a class="nav-link" href="index.html">Home</a>
      <a class="nav-link" href="browse.html">Browse</a>
      <a class="nav-link" href="cart.html">Cart</a>
      <a class="nav-link" href="orders.html">Orders</a>
      <a class="nav-link" href="contact.html">Contact</a>

      <span class="nav-user" id="sb-user-area" style="display:none; align-items:center; gap:10px;">
        <span class="badge" id="sb-user-role">guest</span>
        <span class="muted small" id="sb-user-name"></span>
        <a class="nav-link" id="sb-admin-link" href="admin_dashboard.html" style="display:none;">Admin</a>
        <a class="nav-link" id="sb-restaurant-link" href="restaurant_dashboard.html" style="display:none;">Restaurant</a>
        <a class="nav-link" id="sb-delivery-link" href="delivery_dashboard.html" style="display:none;">Delivery</a>
        <a class="nav-link" href="#" id="sb-logout">Logout</a>
      </span>
      <span class="nav-user" id="sb-guest-area" style="display:flex; align-items:center; gap:10px;">
        <a class="nav-link" href="login.html">Login</a>
        <a class="nav-link" href="register.html">Registration</a>
      </span>
    </nav>
  </div>
</header>

<main class="container" style="padding:22px 0 44px;">
  <div class="portal cardx">

    <aside class="side">
      <div class="title">My Restaurant</div>
      <a href="restaurant_dashboard.html">Dashboard</a>
      <a class="active" href="restaurant_orders.html">Orders</a>
      <a href="restaurant_menu.html">Menu</a>
      <a href="restaurant_profile.html">Profile</a>
    </aside>

    <section class="main-area">
      <h1 class="big-title">Orders</h1>
      <p class="muted">Update order status & assign delivery.</p>

      <div class="cardx" style="margin-top:14px;">
        <table class="tablex">
          <thead>
            <tr>
              <th style="width:80px">ID</th>
              <th style="width:180px">Customer</th>
              <th style="width:140px">Status</th>
              <th style="width:160px">Items Total</th>
              <th>Assign Rider</th>
              <th>Change Status</th>
            </tr>
          </thead>
          <tbody id="ro-body"></tbody>
        </table>
      </div>
    </section>

  </div>
</main>

<footer class="footer">
  <div class="container footer-inner">
    <div class="muted small">© <span id="sb-year"></span> SmartBite. All rights reserved.</div>
  </div>
</footer>

<script src="js/app.js"></script>
<script src="js/restaurant/guard.js"></script>
<script>
  const KEY = "sb_rest_orders";

  const riders = ["Abdullah Rezaul", "Emam", "Rider"];

  const seed = [
    {id:12, customer:"sabbir", status:"pending", total:80, rider:""},
    {id:11, customer:"sabbir", status:"pending", total:160, rider:""},
    {id:10, customer:"sabbir", status:"delivered", total:30, rider:"Abdullah Rezaul"}
  ];

  function load(){
    const raw = localStorage.getItem(KEY);
    return raw ? JSON.parse(raw) : seed;
  }
  function save(list){ localStorage.setItem(KEY, JSON.stringify(list)); }

  function riderOptions(selected){
    const opts = [`<option value="">Select</option>`]
      .concat(riders.map(r=>`<option ${r===selected?"selected":""} value="${r}">${r}</option>`));
    return opts.join("");
  }
  function statusOptions(selected){
    const arr = ["pending","preparing","ready","delivered","cancelled"];
    return arr.map(s=>`<option ${s===selected?"selected":""} value="${s}">${s}</option>`).join("");
  }

  function render(){
    const list = load();
    const body = document.getElementById("ro-body");
    body.innerHTML = list.map(o=>`
      <tr>
        <td>#${o.id}</td>
        <td>${o.customer}</td>
        <td><span class="status-pill">${o.status}</span></td>
        <td>৳ ${Number(o.total).toFixed(2)}</td>

        <td>
          <select class="inputx" data-k="rsel" data-id="${o.id}">
            ${riderOptions(o.rider)}
          </select>
          <div style="display:flex; gap:10px; align-items:center; margin-top:10px;">
            <button class="pill-outline" data-act="assign" data-id="${o.id}" type="button">Assign</button>
            <span class="help">Current: ${o.rider ? o.rider : "None"}</span>
          </div>
        </td>

        <td>
          <select class="inputx" data-k="ssel" data-id="${o.id}">
            ${statusOptions(o.status)}
          </select>
          <div style="margin-top:10px;">
            <button class="pill-primary" data-act="update" data-id="${o.id}" type="button">Update</button>
          </div>
        </td>
      </tr>
    `).join("");

    body.querySelectorAll("button[data-act]").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        const id = Number(btn.dataset.id);
        const list = load();
        const o = list.find(x=>x.id===id);

        if(btn.dataset.act==="assign"){
          const sel = body.querySelector(`select[data-k="rsel"][data-id="${id}"]`);
          o.rider = sel.value;
          save(list); render();
        }

        if(btn.dataset.act==="update"){
          const sel = body.querySelector(`select[data-k="ssel"][data-id="${id}"]`);
          o.status = sel.value;
          save(list); render();
        }
      });
    });
  }

  render();
</script>
</body>
</html>
