<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Register | SmartBite</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/register.css">
</head>
<body>
<header class="topbar">
  <div class="topbar-inner container">
    <div class="brand">
      <div class="logo-dot"></div>
      <a class="brand-name" href="index.html">SmartBite</a>
    </div>

    <nav class="nav" id="sb-nav">
      <a class="nav-link" href="index.html">Home</a>
      <a class="nav-link" href="browse.html">Browse</a>
      <a class="nav-link" href="cart.html">Cart</a>
      <a class="nav-link" href="orders.html">Orders</a>
      <a class="nav-link" href="contact.html">Contact</a>

      <span class="nav-user" id="sb-user-area" style="display:none; align-items:center; gap:10px;">
        <span class="badge" id="sb-user-role">guest</span>
        <span class="muted small" id="sb-user-name"></span>
        <a class="nav-link" id="sb-admin-link" href="admin_dashboard.html" style="display:none;">Admin</a>
        <a class="nav-link" id="sb-restaurant-link" href="restaurant_dashboard.html" style="display:none;">Restaurant</a>
        <a class="nav-link" id="sb-delivery-link" href="delivery_dashboard.html" style="display:none;">Delivery</a>
        <a class="nav-link" href="#" id="sb-logout">Logout</a>
      </span>

      <span class="nav-user" id="sb-guest-area" style="display:flex; align-items:center; gap:10px;">
        <a class="nav-link" href="login.html">Login</a>
        <a class="nav-link" href="register.html">Registration</a>
      </span>
    </nav>
  </div>
</header>


<main class="container auth-center">
  <section class="auth-card">
    <h1 class="auth-title">Registration</h1>
    <p class="auth-sub">Create your account.</p>

    <form class="auth-form" id="register-form">
      <div class="field">
        <label for="name">Name</label>
        <input id="name" class="auth-input" type="text" name="name" placeholder="Your name" required maxlength="50">
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input id="email" class="auth-input auth-input-blue" type="email" name="email" placeholder="you@email.com" required>
      </div>

      <div class="field">
        <label for="role">Account Type</label>
        <select id="role" class="auth-input auth-input-select" name="role" required>
          <option value="customer" selected>Customer</option>
          <option value="restaurant">Restaurant Owner</option>
          <option value="delivery">Delivery Rider</option>
        </select>
      </div>

      <button class="auth-btn" type="submit">Create Account</button>

      <div id="register-msg" class="auth-msg" aria-live="polite"></div>
    </form>

    <div class="auth-foot">
      <span>Already have an account?</span>
      <a class="auth-link" href="login.html">Login</a>
    </div>
  </section>
</main>


<footer class="footer">
  <div class="container footer-inner">
    <div class="muted small">© <span id="sb-year"></span> SmartBite. All rights reserved.</div>
  </div>
</footer>


  <script src="js/app.js"></script>
  <script src="js/pages/register.js"></script>
</body>
</html>
