    <div class="brand">
      <div class="logo-dot"></div>
      <a class="brand-name" href="index.html">SmartBite</a>

    <nav class="nav" id="sb-nav">
      <a class="nav-link" href="index.html">Home</a>
      <a class="nav-link" href="browse.html">Browse</a>
      <a class="nav-link" href="cart.html">Cart</a>
      <a class="nav-link" href="orders.html">Orders</a>
      <a class="nav-link" href="contact.html">Contact</a>

      <span class="nav-user" id="sb-user-area" style="display:none; align-items:center; gap:10px;">
        <span class="badge" id="sb-user-role">guest</span>
        <span class="muted small" id="sb-user-name"></span>
        <a class="nav-link" id="sb-admin-link" href="admin_dashboard.html" style="display:none;">Admin</a>
        <a class="nav-link" id="sb-restaurant-link" href="restaurant_dashboard.html" style="display:none;">Restaurant</a>

<<main class="container admin-wrap">
  <section class="admin-card card">
    <h1 class="admin-title">Users</h1>
    <p class="muted admin-sub">Admin can view & delete any user.</p>

    <div class="toolbar">
      <input class="search" id="user-q" placeholder="Search by name, email, role...">
      <button class="pill-outline" id="user-search">Search</button>
      <button class="pill-outline" id="user-reset">Reset</button>
    </div>

    <div class="table-wrap">
      <table class="table admin-table">
        <thead>
          <tr>
            <th style="width:90px">ID</th>
            <th style="width:180px">Role</th>
            <th>Name</th>
            <th>Email</th>
            <th style="width:180px; text-align:center;">Action</th>
          </tr>
        </thead>
        <tbody id="users-body"></tbody>
      </table>
    </div>
  </section>
</main>

<footer class="footer">
  <div class="container footer-inner">
    <div class="muted small">© <span id="sb-year"></span> SmartBite. All rights reserved.</div>
  </div>
